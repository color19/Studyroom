<style>
/* Layout: an institutional allocation report. Subjects are holdings, exam weights are the target allocation, practice is the position; pages sit on faint chart-paper dots, numbers set like a fund factsheet. */
:root{
  --paper:#F3F5F8; --card:#FFFFFF; --ink:#0B1F3A; --muted:#5A6B80; --line:#D8DFE8; --soft:#E8EDF3; --dot:rgba(11,31,58,.10);
  --accent:#0E6B66; --accent-ink:#FFFFFF; --accent-soft:#D8EEEC;
  --over:#0E6B66; --under:#C4533A; --gold:#B9891F;
  --good:#1D7A4C; --good-soft:#DFF1E6; --bad:#B8422B; --bad-soft:#F7E3DD; --flag:#8A6510; --flag-soft:#F6EBCB; --marker:#F0CF6A; --k0:#7A4FD6; --k1:#D9730D; --k2:#0F8C8C; --k3:#2563C9; --k4:#C2337A; --k5:#5E8C1F;
  --fig-bg:#FFFFFF; --hero-bg:#0B1F3A; --hero-fg:#EEF2F8;
  --f-display:"Bodoni Moda","Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --f-body:"IBM Plex Sans","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0A1424; --card:#0F1C30; --ink:#E6ECF4; --muted:#8C9BB0; --line:#22334D; --soft:#16253B; --dot:rgba(230,236,244,.07);
  --accent:#4FC2B5; --accent-ink:#0A1424; --accent-soft:#123B3B;
  --over:#4FC2B5; --under:#F08A70; --gold:#E2B85A;
  --good:#5FCB8E; --good-soft:#143222; --bad:#F08C76; --bad-soft:#3B1D17; --flag:#E9C552; --flag-soft:#3A3113; --marker:#7A6420; --k0:#B79BFF; --k1:#FFAA5C; --k2:#4FD1D1; --k3:#7FAEFF; --k4:#FF85C0; --k5:#A6D95B;
  --fig-bg:#F4F6F2; --hero-bg:#13284A; --hero-fg:#E6ECF4; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0A1424; --card:#0F1C30; --ink:#E6ECF4; --muted:#8C9BB0; --line:#22334D; --soft:#16253B; --dot:rgba(230,236,244,.07);
  --accent:#4FC2B5; --accent-ink:#0A1424; --accent-soft:#123B3B;
  --over:#4FC2B5; --under:#F08A70; --gold:#E2B85A;
  --good:#5FCB8E; --good-soft:#143222; --bad:#F08C76; --bad-soft:#3B1D17; --flag:#E9C552; --flag-soft:#3A3113; --marker:#7A6420; --k0:#B79BFF; --k1:#FFAA5C; --k2:#4FD1D1; --k3:#7FAEFF; --k4:#FF85C0; --k5:#A6D95B;
  --fig-bg:#F4F6F2; --hero-bg:#13284A; --hero-fg:#E6ECF4; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* rail */
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:22px;background:var(--paper)}
.brand{padding:0 10px}
.brand b{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:.2px;display:block;line-height:1.15}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .lab{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding:10px 10px 4px}
.nav button{display:flex;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;color:var(--ink);font-size:14.5px}
.nav button:hover{background:var(--soft)}
.nav button.on{background:var(--card);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.nav .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px;display:flex;flex-direction:column;gap:6px}
.sync{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--flag)}
main{min-width:0;padding-block:32px 64px;padding-inline:clamp(16px,4vw,48px)}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
/* type */
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:500;font-size:clamp(30px,4.4vw,44px);line-height:1.1;margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
h1 em,h2 em{font-style:italic;color:var(--accent)}
h2{font-family:var(--f-display);font-weight:500;font-size:24px;margin:0;line-height:1.2;text-wrap:balance}
h3{font-size:15px;margin:0;font-weight:600}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
/* blocks */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:999px;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.soft{opacity:.55}
.btn.sm{padding:6px 12px;font-size:13px}
.link{border:0;background:none;color:var(--accent);padding:0;font-size:14px}
.link:hover{text-decoration:underline}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.flag{background:var(--flag-soft);color:var(--flag)} .tag.good{background:var(--good-soft);color:var(--good)}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:stretch}
.today{background:var(--hero-bg);color:var(--hero-fg);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.today .eyebrow{color:color-mix(in srgb,var(--hero-fg) 65%,transparent)}
.today h2{color:var(--hero-fg)}
.today .mix{display:flex;gap:6px;flex-wrap:wrap}
.today .mix span{font-size:12px;border:1px solid color-mix(in srgb,var(--hero-fg) 30%,transparent);border-radius:999px;padding:2px 9px}
.today .btn.pri{background:var(--hero-fg);color:var(--hero-bg);border-color:var(--hero-fg)}
.today .link{color:color-mix(in srgb,var(--hero-fg) 80%,transparent)}
.tvm{display:flex;flex-direction:column;gap:10px}
.tvm svg{width:100%;height:auto;display:block}
.tvm .cap{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.stat{padding:16px 18px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.subj{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:8px}
.subj:hover{border-color:var(--accent)}
.subj .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.subj .no{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.subj .zh{font-weight:600;font-size:15px}
.subj .en{font-size:12px;color:var(--muted);margin-top:-6px}
.bar{height:5px;background:var(--soft);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.g{background:var(--good)} .bar i.b{background:var(--bad)}
.subj .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.next{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.next .panel{display:flex;flex-direction:column;gap:8px;padding:18px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
/* chapter picker */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.rlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.ritem{display:grid;grid-template-columns:auto minmax(0,1fr) 120px auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.ritem:first-child{border-top:0}
.ritem input{width:17px;height:17px;accent-color:var(--accent)}
.ritem .t{min-width:0}
.ritem .t b{font-weight:500;display:block}
.ritem .t small{color:var(--muted);font-size:12px}
.ritem .pct{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;min-width:72px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.opts label.h{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
.searchbox{display:flex;gap:8px}
.searchbox input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit}
/* question */
.qbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line)}
.qbar .l{display:flex;gap:14px;align-items:center;flex-wrap:wrap;min-width:0}
.pausebtn{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 11px;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit}
.pausebtn:hover{color:var(--ink);border-color:var(--ink)}
#view.sess-paused>*:not(.qbar):not(.pauseov){filter:blur(12px);pointer-events:none;user-select:none}
.pauseov{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 55%,transparent);padding:16px}
.pauseov .pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 32px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.pauseov .pcard b{font-size:40px;font-family:var(--f-mono)}
.pauseov .pcard span{color:var(--muted);font-size:14px;line-height:1.6}
.resume{display:flex;flex-direction:column;gap:10px}
.rsrow{display:flex;align-items:center;gap:14px;justify-content:space-between;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 16px;background:var(--card);flex-wrap:wrap}
.rsrow>div{display:flex;flex-direction:column;gap:3px}.rsrow span{font-size:13px;color:var(--muted)}
.timer{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,30px);display:flex;flex-direction:column;gap:18px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.qhead b{color:var(--ink);font-family:var(--f-display);font-size:19px;font-weight:600}
.qtext{font-size:16px;line-height:1.7;min-width:0}
.qtext p{margin:0 0 10px} .qtext p:last-child{margin-bottom:0}
.qtext p.ind{padding-left:22px}
.qtext ul{margin:0 0 10px;padding-left:22px}
.qtext sub,.qtext sup{font-size:.72em}
.gap{display:inline-block;width:2.2em}
.addn{margin-left:8px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;vertical-align:2px}
.qtools{display:flex;gap:6px;align-items:center}
.tog{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:3px 11px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.tog.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.tog .kbd{font-size:10.5px;padding:0 4px}
.trx{margin-top:10px;padding:10px 14px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent);border-radius:0 8px 8px 0;font-size:15px;line-height:1.75;white-space:pre-wrap;color:var(--ink)}
.trx table{border-collapse:collapse;margin:6px 0;font-size:13.5px;white-space:normal}.trx td{border:1px solid var(--line);padding:3px 8px}
.tro{display:block;margin-top:4px;font-size:13.5px;line-height:1.6;color:var(--muted);white-space:pre-wrap}
.gt{text-decoration:underline dotted var(--accent);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help}
.gt:hover,.gt.act{background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:3px}
#gpop{position:absolute;z-index:60;max-width:300px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(11,31,58,.18);padding:10px 13px;font-size:13.5px;line-height:1.6;pointer-events:none}
#gpop b{display:block;font-size:15px;color:var(--accent)}#gpop i{font-style:normal;font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
#gpop p{margin:4px 0 0;color:var(--ink)}
.zhx{display:flex;flex-direction:column;gap:8px;font-size:15.5px;line-height:1.75}
.zhx p{margin:0}
.zhx .tip,.zhx .dispute{font-size:14px;padding:8px 12px;border-radius:8px;background:var(--flag-soft);color:var(--ink)}
.zhx .tip b,.zhx .dispute b{color:var(--flag);margin-right:8px;font-size:12.5px}
.zhx .dispute{background:var(--bad-soft)} .zhx .dispute b{color:var(--bad)}
.zhx .zhsrc{font-size:11.5px;color:var(--muted)}
details.enx{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
details.enx summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
details.enx[open] summary{margin-bottom:8px}
details.enx .qtext{font-size:14.5px}
.today .chips.mode .chip{background:transparent;color:var(--hero-fg);border-color:color-mix(in srgb,var(--hero-fg) 35%,transparent)}
.today .chips.mode .chip.on{background:var(--hero-fg);color:var(--hero-bg)}
.qtext table:not(.qt){border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;margin:6px 0 12px}
.qtext table:not(.qt) td,.qtext table:not(.qt) th{border:1px solid var(--line);padding:6px 10px;vertical-align:top;text-align:left}
.qtext table:not(.qt) thead th,.qtext table:not(.qt) tr:first-child td{background:var(--soft)}
.qtext img:not(.qi){vertical-align:middle;background:var(--fig-bg);border-radius:3px;max-width:100%;height:auto}
.qtext math{font-size:1.08em}
.qtext math[display="block"]{margin:8px 0;overflow-x:auto;max-width:100%}
.case{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin-bottom:12px;color:var(--ink)}
.case::before{content:"案例材料";display:block;font-size:11.5px;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
b.ol{display:inline-block;font-size:12px;padding:0 7px;border-radius:999px;background:var(--soft);margin-right:4px}
.srcl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:4px;border:1px solid var(--line)}
.srcl.src-k{color:var(--accent);border-color:var(--accent)}
.srcl.src-p,.srcl.src-t,.srcl.src-m{color:var(--good);border-color:var(--good)}
.mockgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.mockb{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mockb:hover{border-color:var(--accent)}
.mockb b{font-weight:600;font-size:14px}
.mockb span{font-size:12px;color:var(--muted)}
.qi{display:block;max-width:100%;height:auto;background:var(--fig-bg);border-radius:6px;padding:6px;margin:6px 0 12px;border:1px solid var(--line)}
.tw{overflow-x:auto;margin:6px 0 12px;max-width:100%}
table.qt{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.qt td{border:1px solid var(--line);padding:6px 10px;vertical-align:top}
table.qt tr:first-child td{background:var(--soft);font-weight:500}
table.qt.plain td{border:0;border-bottom:1px solid var(--line);padding:5px 14px 5px 0}
table.qt.plain tr:first-child td{background:none;font-weight:400}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;font-size:15.5px;line-height:1.55}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice .k{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:500}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.right .k{background:var(--good);color:var(--card);border-color:var(--good)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .k{background:var(--bad);color:var(--card);border-color:var(--bad)}
.choice:disabled{cursor:default}
.choice .mk{font-size:12px;font-weight:600}
.choice.right .mk{color:var(--good)} .choice.wrong .mk{color:var(--bad)}
.qact{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.unsure{border:1px dashed var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.unsure.on{border-style:solid;border-color:var(--flag);color:var(--flag);background:var(--flag-soft)}
.verdict{font-weight:600}
.verdict.g{color:var(--good)} .verdict.b{color:var(--bad)}
.exp{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:10px}
.exp .eyebrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.exp .qtext{font-size:15px}
.zh{color:var(--muted)}
.note{display:flex;flex-direction:column;gap:6px}
.note textarea{width:100%;min-height:64px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical}
.note small{color:var(--muted);font-size:12px}
.grid-nav{display:flex;flex-wrap:wrap;gap:5px}
.grid-nav button{width:34px;height:30px;border:1px solid var(--line);background:var(--card);border-radius:6px;font-family:var(--f-mono);font-size:12px;padding:0}
.grid-nav button.cur{outline:2px solid var(--accent);outline-offset:1px}
.grid-nav button.ans{background:var(--accent-soft);border-color:var(--accent)}
.grid-nav button.g{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.grid-nav button.b{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.grid-nav button.f{box-shadow:inset 0 -3px 0 var(--flag)}
details.navd summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none}
details.navd summary::-webkit-details-marker{display:none}
details.navd[open] summary{margin-bottom:10px}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
/* lists */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px 16px;border-top:1px solid var(--line);align-items:center}
.li:first-child{border-top:0}
.li .snip{font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.li .m{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.li .acts{display:flex;gap:6px}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px;font-weight:500;margin-bottom:4px}
/* allocation */
.drift{position:relative;height:18px;display:block}
.drift::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--ink);opacity:.5}
.drift i{position:absolute;top:4px;height:10px;border-radius:1px}
.drift i.o{left:50%;background:var(--over)}
.drift i.u{right:50%;background:var(--under)}
.dv{font-family:var(--f-mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.dv.o{color:var(--over)} .dv.u{color:var(--under)}
.frontier text{font-family:var(--f-body)}
.hd-sub{display:block;font-family:var(--f-mono);font-size:14px;letter-spacing:.04em;color:var(--under);margin-top:14px;font-style:normal}
.alloc-note{font-size:12.5px;color:var(--muted)}
/* report */
.rep{display:flex;flex-direction:column;gap:12px}
.repl{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:12px;align-items:center;font-size:13.5px}
.repl .bar{height:9px}
.repl .v{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;align-items:end;height:140px}
.days .d{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.days .d i{display:block;width:100%;max-width:26px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.days .d span{font-size:10.5px;color:var(--muted);font-family:var(--f-mono)}
.days .d em{font-style:normal;font-size:10.5px;font-family:var(--f-mono);color:var(--muted)}
table.hist{width:100%;border-collapse:collapse;font-size:13.5px}
table.hist td,table.hist th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.hist th{font-weight:500;color:var(--muted);font-size:12px}
.result-hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.score{font-family:var(--f-display);font-size:64px;line-height:1;font-weight:500}
.score small{font-size:22px;color:var(--muted)}
.confirm{border:1px solid var(--flag);background:var(--flag-soft);border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.topbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;gap:10px;align-items:center;overflow-x:auto}
  .topbar b{font-family:var(--f-display);font-size:17px;white-space:nowrap;margin-right:6px}
  .topbar button{border:0;background:none;padding:6px 10px;border-radius:999px;font-size:14px;white-space:nowrap}
  .topbar button.on{background:var(--ink);color:var(--paper)}
  .qbar{top:calc(env(safe-area-inset-top,0px) + 53px)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:560px){
  .ritem{grid-template-columns:auto minmax(0,1fr) auto}
  .ritem .bar{display:none}
  .repl{grid-template-columns:96px minmax(0,1fr) 84px}
  .choice{grid-template-columns:30px minmax(0,1fr) auto;padding:10px 12px}
}
@media (prefers-reduced-motion:no-preference){
  .choice,.btn,.subj{transition:border-color .15s,background-color .15s}
}

/* ===== editorial layer ===== */
body{background-color:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px;-webkit-font-smoothing:antialiased}
.rail{border-right:1px solid var(--line);background:color-mix(in srgb,var(--paper) 88%,var(--card))}
.brand b{font-family:var(--f-display);font-weight:700;font-size:25px;letter-spacing:-.01em}
.brand small{letter-spacing:.14em}
.nav button{border-radius:0;padding:9px 10px;font-size:14.5px}
.nav button.on{background:transparent;box-shadow:none;font-weight:600;color:var(--accent)}
.nav button.on span:first-child{display:inline-flex;align-items:center;gap:8px}
.nav button.on span:first-child::before{content:"";width:7px;height:7px;background:var(--accent);display:inline-block}
h1,.display{font-family:var(--f-display);font-weight:500;letter-spacing:-.02em}
h1{font-size:clamp(34px,5.4vw,64px);line-height:1.04}
h1 em,h2 em,.display em{font-family:"Bodoni Moda",var(--f-display);font-style:italic;font-weight:500;color:var(--accent)}
h2{font-family:var(--f-display);font-size:clamp(22px,2.6vw,30px);letter-spacing:-.01em}
.eyebrow{letter-spacing:.16em}
.panel{border-radius:var(--r);background:var(--card)}
.btn{border-radius:2px;letter-spacing:.02em}
.btn.pri{box-shadow:0 1px 0 rgba(0,0,0,.08),0 6px 16px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.pri:active{transform:translateY(1px)}
.chip{border-radius:2px}
.choice{border-radius:var(--r)}
.qcard{border-radius:var(--r);box-shadow:0 1px 0 var(--line),0 18px 40px -28px rgba(18,36,27,.35)}
.qhead b{font-family:var(--f-display)}
.zhx .tip{background:none;padding:0}
.zhx .tip b{background:linear-gradient(transparent 55%,var(--marker) 55%);color:var(--ink);padding:0 2px}
.zhx .dispute{border-left:3px solid var(--bad);border-radius:0}
.num,.stat b{font-variant-numeric:tabular-nums lining-nums}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:var(--len,1200)}to{stroke-dashoffset:0}}
.rise{animation:rise .75s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
path.draw{stroke-dasharray:var(--len,1200);animation:draw 1.6s cubic-bezier(.4,.1,.2,1) .25s both}
@media (prefers-reduced-motion:reduce){.rise,path.draw{animation:none}}
/* ===== creative layer ===== */
.tape{position:relative;overflow:hidden;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin:-4px 0 6px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tape-in{display:inline-flex;gap:0;padding:9px 0;animation:tape 46s linear infinite}
.tape:hover .tape-in{animation-play-state:paused}
.tk{display:inline-flex;align-items:baseline;gap:7px;padding:0 22px;border-right:1px solid var(--line)}
.tk b{font-weight:600;color:var(--ink)}
.tk .px{color:var(--ink)}
.tk .up{color:var(--over)} .tk .dn{color:var(--under)} .tk .fl{color:var(--muted)}
.tk small{color:var(--muted);font-size:11px}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.frontier g[data-s]{transition:opacity .25s}
.frontier.dim g[data-s]:not(.hl) > *{opacity:.18}
.frontier g[data-s] > *{transition:opacity .25s}
.frontier g.hl circle{stroke-width:3}
.ledger.dim .lrow:not(.head):not(.hl) > *{opacity:.35}
.lrow > *{transition:opacity .2s}
.frontier .ring{fill:none;stroke:var(--under);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ring 2.4s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.pnl{font-family:var(--f-mono);font-size:13px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.pnl b{color:var(--ink);font-weight:600}
.pnl.flash-g{animation:fg .9s ease-out}
.pnl.flash-b{animation:fb .9s ease-out}
@keyframes fg{0%{background:color-mix(in srgb,var(--over) 40%,transparent);border-color:var(--over)}100%{background:transparent}}
@keyframes fb{0%{background:color-mix(in srgb,var(--under) 40%,transparent);border-color:var(--under)}100%{background:transparent}}
.tick-pop{position:absolute;right:0;top:-6px;font-family:var(--f-mono);font-size:12px;font-weight:600;pointer-events:none;animation:pop 1.1s ease-out both}
.tick-pop.g{color:var(--over)} .tick-pop.b{color:var(--under)}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.slip{border:1px solid var(--ink);background:var(--card);padding:22px 24px 18px;position:relative}
.slip::before,.slip::after{content:"";position:absolute;left:0;right:0;height:8px;background:radial-gradient(circle at 6px -2px,var(--paper) 5px,transparent 5.5px) 0 0/12px 8px repeat-x}
.slip::before{top:-1px}.slip::after{bottom:-1px;transform:scaleY(-1)}
.slip-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:12px}
.slip-h b{font-family:var(--f-display);font-size:20px;letter-spacing:0;text-transform:none;color:var(--ink)}
.rb{display:grid;grid-template-columns:96px minmax(0,1fr) 168px;gap:14px;align-items:center;padding:7px 0;font-size:13.5px}
.rb.touched .rn{font-weight:600}
.rb:not(.touched){opacity:.55}
.rbar{position:relative;height:10px;background:color-mix(in srgb,var(--line) 60%,transparent)}

async function flush(){

    while(DB.dirty.size){

async function initDB(){

// ---------- progress helpers
function rec(id){return S.prog[id]}
function statsFor(ids){
  let done=0,first=0,book=0,unsure=0,wrong=0,due=0,mast=0;
  for(const id of ids){const r=S.prog[id];if(!r)continue;if(r.n){done++;first+=r.f?1:0}if(r.b){book++;if(isDue(r))due++}if(!r.b&&(r.g||r.w>0))mast++;if(r.u)unsure++;if(r.w)wrong++}
  return {total:ids.length,done,first,acc:done?first/done:null,book,unsure,wrong,due,mast};
}
function allIds(){return Object.keys(S.Q)}
function totalSecs(){let s=0;for(const d in S.log.days)s+=S.log.days[d][2]||0;return s}
const GAPS=[1,2,4,7,15];const DAY=864e5;
function dayEnd(){const d=new Date();d.setHours(23,59,59,999);return d.getTime()}
function startOfDay(t){const d=new Date(t);d.setHours(4,0,0,0);return d.getTime()}
function examTs(){const e=S.cfg&&S.cfg.exam;if(!e)return 0;const t=new Date(e+'T04:00:00').getTime();return isNaN(t)?0:t}
function daysToExam(){const t=examTs();if(!t)return null;return Math.round((t-startOfDay(Date.now()))/DAY)}
function gapAt(st){const g=GAPS[st];const D=daysToExam();if(D==null||D<=2)return g;const avail=D-2;const rest=GAPS.slice(st);const tot=rest.reduce((a,b)=>a+b,0);
  if(avail>=tot)return g;if(avail<=rest.length)return 1;return Math.max(1,Math.round(g*avail/tot))}
function clampDue(d){const t=examTs();if(!t)return d;const last=t-2*DAY;return (last>Date.now()&&d>last)?startOfDay(last):d}
function schedPreview(){const out=[];let t=Date.now();for(let i=0;i<GAPS.length;i++){const D=daysToExam();let g=GAPS[i];if(D!=null&&D>2){const avail=D-2-Math.round((t-Date.now())/DAY);const rest=GAPS.slice(i),tot=rest.reduce((a,b)=>a+b,0);g=avail>=tot?g:(avail<=rest.length?1:Math.max(1,Math.round(g*avail/tot)))}t=clampDue(startOfDay(t+g*DAY));out.push(t)}return out}
function reclampAll(){let n=0;for(const id in S.prog){const r=S.prog[id];if(r&&r.b&&r.d){const d2=clampDue(r.d);if(d2!==r.d){r.d=d2;n++;markDirty('p_'+subjOf(id))}}}return n}
function srsFail(r){r.b=1;r.s=0;r.d=clampDue(startOfDay(Date.now()+gapAt(0)*DAY));r.g=0}
function srsPass(r){ // a correct, confident review
  if(!r.b)return;if(r.s==null){r.s=0}
  if(r.d&&r.d>dayEnd())return; // not due yet: reviewing early does not advance
  r.s++;if(r.s>=GAPS.length){r.b=0;r.g=1;r.d=0;return}
  r.d=clampDue(startOfDay(Date.now()+gapAt(r.s)*DAY))}
function isDue(r){return r&&r.b&&(!r.d||r.d<=dayEnd())}
function inBook(r){return !!(r&&(r.b||r.w>0||r.g))}
function prio(r){return isDue(r)?0:r.b?1:2}
function recordAnswer(id,choice,unsure){
  const q=S.Q[id];const ok=choice===q.a?1:0;const r=S.prog[id]||{n:0,w:0};r.c=choice;
  if(!r.n)r.f=ok; r.n=(r.n||0)+1; r.l=ok; if(!ok)r.w=(r.w||0)+1; r.u=unsure?1:0; r.t=Date.now();
  if(!ok||unsure)srsFail(r); else srsPass(r);
  S.prog[id]=r;
  const d=today();const day=S.log.days[d]||[0,0,0];day[0]++;day[1]+=ok;S.log.days[d]=day;
  markDirty('p_'+subjOf(id));markDirty('log');
  return ok;
}
function addSecs(sec,sj){if(sec<=0)return;const d=today();const day=S.log.days[d]||[0,0,0];day[2]=Math.round((day[2]||0)+sec);S.log.days[d]=day;if(sj){S.log.sj=S.log.sj||{};S.log.sj[sj]=Math.round((S.log.sj[sj]||0)+sec)}markDirty('log')}

// ---------- picking
function weightedPick(n,pool){ // pool: id list; sample by exam weights across subjects
  const bys={};pool.forEach(id=>{const s=subjOf(id);(bys[s]=bys[s]||[]).push(id)});
  const subs=Object.keys(bys);const tw=subs.reduce((a,s)=>a+WEIGHTS[s],0);
  let out=[];const quota={};let assigned=0;
  subs.forEach(s=>{quota[s]=Math.floor(n*WEIGHTS[s]/tw);assigned+=quota[s]});
  const rem=shuffle(subs).sort((a,b)=>WEIGHTS[b]-WEIGHTS[a]);let i=0;while(assigned<n&&rem.length){quota[rem[i%rem.length]]++;assigned++;i++}
  subs.forEach(s=>{out=out.concat(shuffle(bys[s]).slice(0,quota[s]))});
  if(out.length<n){const left=shuffle(pool.filter(id=>!out.includes(id)));out=out.concat(left.slice(0,n-out.length))}
  return shuffle(out).slice(0,n);
}
function todaySet(){
  const book=shuffle(allIds().filter(id=>isDue(S.prog[id]))).slice(0,6);
  const unseen=allIds().filter(id=>!S.prog[id]||!S.prog[id].n);
  const pool=unseen.length>=20?unseen:allIds();
  const rest=weightedPick(20-book.length,pool.filter(id=>!book.includes(id)));
  return {ids:shuffle(book.concat(rest)),nBook:book.length};
}

function dayKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function lastDays(n){const out=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setHours(12);d.setDate(d.getDate()-i);out.push([dayKey(d),S.log.days[dayKey(d)]||[0,0,0],d])}return out}
let WSUM=1;
function alloc(){
  const rows=S.meta.subjects.map(s=>{const x=statsFor(S.bySubj[s.id]);return {s,x,target:WEIGHTS[s.id]/WSUM*100}});

}
function frontierSvg(rows,lag){

  g+=xt.map(v=>`<text x="${px(v)}" y="${H-B+14}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}%</text>`).join('');
  g+=`<text x="${W-R}" y="${H-6}" text-anchor="end" font-size="10.5" fill="var(--muted)">覆盖率 →</text><text x="${L}" y="${T-4}" font-size="10.5" fill="var(--muted)">↑ 首次正确率</text>`;
  if(!pts.length){g+=`<text x="${(L+W-R)/2}" y="${(T+H-B)/2}" text-anchor="middle" font-size="12" fill="var(--muted)">做题之后，各科目会出现在这里</text>`}
  pts.sort((a,b)=>b.target-a.target).forEach((r,i)=>{const cx=px(r.cov),cy=py(r.x.acc*100),rad=4+Math.sqrt(r.target)*1.6;const col=r.x.acc>=.7?'var(--over)':'var(--under)';
    const ring=lag===r.s.id?`<circle class="ring" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rad.toFixed(1)}"/>`:'';
    g+=`<g class="rise" data-s="${r.s.id}" style="--i:${4+i}">${ring}<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rad.toFixed(1)}" fill="color-mix(in srgb,${col} 22%,transparent)" stroke="${col}" stroke-width="1.5"><title>${r.s.zh}：覆盖 ${r.cov.toFixed(1)}%，首次正确 ${Math.round(r.x.acc*100)}%</title></circle><text x="${(cx+rad+3).toFixed(1)}" y="${(cy+3.5).toFixed(1)}" font-size="11" fill="var(--ink)">${r.s.zh}</text></g>`});

const TCODE={quant:'QUANT',econ:'ECON',corp:'CORP',fsa:'FSA',equity:'EQUITY',fi:'FI',deriv:'DERIV',alt:'ALT',pm:'PM',ethics:'ETHICS'};

function nextCards(){
  const out=[];
  const st=S.meta.subjects.map(s=>({s,x:statsFor(S.bySubj[s.id])}));
  const weak=st.filter(o=>o.x.done>=10).sort((a,b)=>a.x.acc-b.x.acc)[0];
  if(weak)out.push(`<div class="panel"><span class="eyebrow">正确率最低</span><h3>${weak.s.zh} · ${Math.round(weak.x.acc*100)}%</h3><p class="sub" style="margin:0">已做 ${weak.x.done} 题。再练 20 题同科目的新题，先补这块短板。</p><div><button class="btn sm" data-quick="weak:${weak.s.id}">练 ${weak.s.zh}</button></div></div>`);
  const gap=st.map(o=>({...o,need:WEIGHTS[o.s.id]*(1-o.x.done/o.x.total)})).sort((a,b)=>b.need-a.need)[0];
  if(gap)out.push(`<div class="panel"><span class="eyebrow">考纲权重高、覆盖少</span><h3>${gap.s.zh} · 目标配置约 ${WEIGHTS[gap.s.id]}%</h3><p class="sub" style="margin:0">已覆盖 ${Math.round(gap.x.done/gap.x.total*100)}%（${gap.x.done}/${gap.x.total}）。</p><div><button class="btn sm" data-quick="gap:${gap.s.id}">练 ${gap.s.zh}</button></div></div>`);
  const b=statsFor(allIds()).book;
  out.push(`<div class="panel"><span class="eyebrow">错题本</span><h3>${b?b+' 道待复习':'还没有错题'}</h3><p class="sub" style="margin:0">${b?'按记忆曲线安排复习：第 1、3、7、14、29 天各答对一次，五轮都过才算掌握。':'答错或标记“不确定”的题会自动收进来。'}</p><div><button class="btn sm" data-nav="book">打开错题本</button></div></div>`);
  return out.join('');
}

function chapterPool(){
  const c=S.chapter;let ids=[];const order=S.meta.readings.map(r=>r.id);[...c.sel].sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(r=>ids=ids.concat(S.byRead[r]||[]));
  if(c.scope==='new')ids=ids.filter(id=>!S.prog[id]||!S.prog[id].n);
  if(c.scope==='wrong')ids=ids.filter(id=>S.prog[id]&&S.prog[id].w);
  if(c.scope==='book')ids=ids.filter(id=>S.prog[id]&&S.prog[id].b);
  return ids;
}
function searchQ(q){
  const ql=q.toLowerCase();const out=[];
  for(const id in S.Q){const x=S.Q[id];if((x.qid&&x.qid===q)||(x.s+' '+x.o.join(' ')).toLowerCase().replace(/<[^>]+>/g,' ').includes(ql))out.push(id)}
  return out;
}

function kpOf(id){const q=S.Q[id];return q&&q.k?q.k:null}
function kpName(k){const m=S.kp[k[0]];return m?m.g[k[1]][0]:''}
function modName(mi){const m=S.kp[mi];return m?(m.zh||m.t):''}
function lastChoice(id){const r=S.prog[id];if(r&&r.c!=null)return r.c;for(let i=S.hist.length-1;i>=0;i--){const h=S.hist[i];const j=h.ids.indexOf(id);if(j>=0){const ch=h.a[j];return ch==='-'?null:'ABCD'.indexOf(ch)}}return null}
const KX=window.katex;
function fx(t){try{return KX?KX.renderToString(String(t),{displayMode:true,throwOnError:false,strict:'ignore',output:'html'}):`<code>${esc(t)}</code>`}catch(e){return `<code>${esc(t)}</code>`}}
function tx(t){t=String(t||'');if(!KX||t.indexOf('\\(')<0)return esc(t);return t.split(/\\\((.+?)\\\)/g).map((x,i)=>i%2?(()=>{try{return KX.renderToString(x,{throwOnError:false,strict:'ignore'})}catch(e){return esc(x)}})():esc(x)).join('')}
function cardOf(key){const b=S.jc&&S.jc[key];const e=S.kce&&S.kce[key];if(!b&&!e)return null;return e?{...(b||{}),c:e.c,f:e.f,p:e.p,t:e.t,ed:e.t0||1}:b}
function kcd(key,label){const c=cardOf(key);if(!c)return '';return `<details class="kcd" ${S._kcKeep===key||S._kceOpen===key?'open':''}><summary><span>讲义要点</span><b>${esc(label)}</b></summary>${kcHtml(key,{head:false})}</details>`}
function kcHtml(key,o={}){const c=cardOf(key);if(!c)return '';const [m,t]=key.split('.').map(Number);const M=S.kp[m];if(!M)return '';
  const head=o.head===false?'':`<div class="kch"><b>${esc(kpName([m,t]))}</b><span>${esc(S.subj[M.sj]?S.subj[M.sj].zh:'')} · ${esc(modName(m))}</span></div>`;
  if(S._kceOpen===key){const lines=a=>esc((a||[]).join('\n'));
    return `<div class="kc kced" style="--tc:var(--k${t%6})" data-kcform="${key}">${head}

    <div class="row"><button class="btn sm pri" data-kcsave="${key}">保存</button><button class="btn sm ghost" data-kccancel="${key}">取消</button>${S.kce[key]&&S.jc[key]?`<button class="link" data-kcreset="${key}">恢复讲义原版</button>`:''}</div></div>`}
  return `<div class="kc" style="--tc:var(--k${t%6})">${head}

  ${c.t&&c.t.length?`<div class="kct"><b>易错</b><ul>${c.t.map(x=>`<li>${tx(x)}</li>`).join('')}</ul></div>`:''}

const KLAB={practice:'练习',exam:'模考',defer:'做完再对'};
function histAns(h){const o={};h.ids.forEach((id,i)=>{const ch=h.a[i];o[id]={c:ch==='-'?null:'ABCD'.indexOf(ch),sub:true}});return o}
function dayLabel(k){const d=new Date(k+'T12:00:00');const t=today();const y=new Date();y.setDate(y.getDate()-1);const yk=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  return (k===t?'今天 · ':k===yk?'昨天 · ':'')+d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'})}
function vHistory(){
  const H=S.hist.filter(h=>h.ids.some(id=>S.Q[id])).slice().reverse();
  const covered=new Set();S.hist.forEach(h=>h.ids.forEach(id=>covered.add(id)));
  const old={};for(const id in S.prog){const r=S.prog[id];if(!r||!r.n||!r.t||covered.has(id)||!S.Q[id])continue;const d=new Date(r.t);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');(old[k]=old[k]||[]).push(id)}
  const groups={};H.forEach((h,i)=>{const d=new Date(h.t);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');(groups[k]=groups[k]||[]).push(h)});
  const tot=H.reduce((a,h)=>a+h.n,0),ok=H.reduce((a,h)=>a+h.c,0);
  const days=Object.keys(groups).sort().reverse().map(k=>`<div class="hday"><div class="sec-h"><h3>${dayLabel(k)}</h3><span class="eyebrow">${groups[k].length} 组 · ${groups[k].reduce((a,h)=>a+h.n,0)} 题</span></div><div class="list">${groups[k].map(h=>{
      const pct=h.n?Math.round(h.c/h.n*100):0;const wr=h.n-h.c;const t=new Date(h.t);
      const subs={};h.ids.forEach(id=>{const q=S.Q[id];if(q)subs[q.sj]=(subs[q.sj]||0)+1});
      return `<div class="li hrow"><div style="min-width:0"><div class="htop"><span class="num htime">${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</span><b>${esc(h.title||'练习')}</b><span class="tag">${KLAB[h.k]||'练习'}</span></div>
        <div class="m"><span class="num" style="color:${pct>=70?'var(--good)':pct>=55?'var(--ink)':'var(--bad)'}">${h.c}/${h.n} · ${pct}%</span><span>用时 ${fmtDur(h.s||0)}</span><span>${Object.entries(subs).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([s,n])=>S.subj[s].zh+' '+n).join(' · ')}</span></div>
        <div class="hmods">${(()=>{const g={};h.ids.forEach((id,i)=>{const k=kpOf(id);if(!k)return;const o=g[k[0]]||(g[k[0]]={n:0,c:0});o.n++;const ch=h.a[i];if(ch!=='-'&&'ABCD'.indexOf(ch)===S.Q[id].a)o.c++});
          return Object.entries(g).sort((a,b)=>b[1].n-a[1].n).map(([mi,o])=>{const p=o.c/o.n;return `<span class="hm ${p>=.7?'g':p>=.5?'':'b'}" title="${esc(S.kp[mi].t)}">${esc(modName(+mi))} <b class="num">${o.c}/${o.n}</b></span>`}).join('')})()}</div></div>
        <div class="acts"><button class="btn sm" data-hv="${h.t}">逐题回顾</button>${wr?`<button class="btn sm ghost" data-hw="${h.t}">只看错题 ${wr}</button><button class="btn sm ghost" data-hr="${h.t}">重做错题</button>`:''}</div></div>`}).join('')}</div></div>`).join('');
  const oldKeys=Object.keys(old).sort().reverse();
  const oldHtml=oldKeys.length?`<section class="hday"><div class="sec-h"><h3>更早的记录</h3></div><div class="list">${oldKeys.map(k=>{const ids=old[k];const c=ids.filter(id=>S.prog[id].l).length;
      const g={};ids.forEach(id=>{const kk=kpOf(id);if(!kk)return;const o=g[kk[0]]||(g[kk[0]]={n:0,c:0});o.n++;if(S.prog[id].l)o.c++});
      return `<div class="li hrow"><div style="min-width:0"><div class="htop"><b>${dayLabel(k)}</b><span class="tag">旧记录</span></div><div class="m"><span class="num">${c}/${ids.length} 最近一次答对</span></div><div class="hmods">${Object.entries(g).sort((a,b)=>b[1].n-a[1].n).map(([mi,o])=>{const p=o.c/o.n;return `<span class="hm ${p>=.7?'g':p>=.5?'':'b'}">${esc(modName(+mi))} <b class="num">${o.c}/${o.n}</b></span>`}).join('')}</div></div>
      <div class="acts"><button class="btn sm" data-ov="${k}">回顾</button>${ids.length-c?`<button class="btn sm ghost" data-ow="${k}">只看错题 ${ids.length-c}</button>`:''}</div></div>`}).join('')}</div></section>`:'';
  S._old=old;
  return `<div><div class="eyebrow">做题记录 · History</div><h1>每一组题，<em>都留了底</em></h1><p class="sub">${H.length?`共 ${H.length} 组 · ${tot.toLocaleString()} 题 · 答对 ${tot?Math.round(ok/tot*100):0}%。`:''}点「逐题回顾」可以看到每道题当时选了什么、正确答案和解析。</p></div>
  ${H.length?days:`<div class="list"><div class="empty"><b>还没有记录</b>做完一组练习或模考，就会出现在这里。</div></div>`}
  ${oldHtml}`;
}

  S._nGroups=keys.map(k=>groups[k]);

function focusStats(){
  const D=S.log.days;let total=0,att=0,active=0;
  for(const k in D){total+=D[k][2]||0;att+=D[k][0]||0;if((D[k][0]||0)>0||(D[k][2]||0)>=60)active++}

// Validate + fill defaults. Throws Error with a readable Chinese message.
function normalizeBank(d){
  if(!d||typeof d!=='object')throw new Error('文件不是 JSON 对象');
  if(!Array.isArray(d.q)||!d.q.length)throw new Error('缺少题目数组 q，或者是空的');
  if(!(Array.isArray(d.subjects)&&d.subjects.length)){const ids=[...new Set(d.q.map(q=>q&&q.sj).filter(Boolean))];const all=ids.every(x=>DEFAULT_SUBJECTS.some(s=>s.id===x));d.subjects=all?DEFAULT_SUBJECTS.filter(s=>ids.includes(s.id)):ids.map((x,i)=>({id:x,zh:x,en:x,no:i+1}))}
  const sj=new Set(d.subjects.map(s=>s.id));
  d.readings=Array.isArray(d.readings)?d.readings:[];
  const rd={};d.readings.forEach(r=>rd[r.id]=r);
  const errs=[];const ids=new Set();
  d.q.forEach((q,i)=>{
    const at=`第 ${i+1} 题${q&&q.id?' ('+q.id+')':''}`;
    if(!q||typeof q!=='object'){errs.push(at+' 不是对象');return}
    if(!q.id)q.id='Q'+(i+1);
    if(ids.has(q.id))errs.push(at+' 的 id 重复');ids.add(q.id);
    if(!sj.has(q.sj))errs.push(at+` 的科目 sj="${q.sj}" 不在 subjects 里`);
    if(typeof q.s!=='string'||!q.s.trim())errs.push(at+' 缺少题干 s');
    if(!Array.isArray(q.o)||q.o.length<2)errs.push(at+' 的选项 o 少于 2 个');
    else if(!(Number.isInteger(q.a)&&q.a>=0&&q.a<q.o.length))errs.push(at+' 的答案 a 不是有效的选项序号 (从 0 开始)');
    if(!q.r){q.r='R-'+(q.src||'mine')+'-'+q.sj}
    if(!rd[q.r]){rd[q.r]={id:q.r,title:q.r,subject:q.sj,src:q.src||'mine',count:0};d.readings.push(rd[q.r])}
    if(q.k&&!(Array.isArray(q.k)&&q.k.length===2))errs.push(at+' 的知识点 k 应为 [章节序号, 知识点序号]');
    delete q.src;
  });
  if(errs.length)throw new Error(errs.slice(0,8).join('\n')+(errs.length>8?`\n……共 ${errs.length} 处问题`:''));
  d.readings.forEach(r=>{r.count=0;if(!r.subject)r.subject=(d.q.find(q=>q.r===r.id)||{}).sj;if(!r.src)r.src='mine'});
  d.q.forEach(q=>rd[q.r].count++);
  d.readings=d.readings.filter(r=>r.count>0);
  const used=[...new Set(d.readings.map(r=>r.src))];
  d.sources=Array.isArray(d.sources)?d.sources:[];
  used.forEach(id=>{if(!d.sources.find(s=>s.id===id))d.sources.push({id,name:id==='mine'?'我的题库':id,short:id==='mine'?'我的':id})});
  d.sources=d.sources.filter(s=>used.includes(s.id));
  d.kp=Array.isArray(d.kp)?d.kp:[];d.gl=Array.isArray(d.gl)?d.gl:[];d.jc=d.jc&&typeof d.jc==='object'?d.jc:{};
  return d;
}

// RFC 4180 CSV parser (quotes, commas and newlines inside quotes, BOM)
function parseCSV(text){
  text=text.replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
const COLS={subject:['subject','科目'],source:['source','来源'],set:['set','chapter','reading','章节','分组'],no:['no','number','题号'],question:['question','stem','题干','题目'],
  A:['a','选项a'],B:['b','选项b'],C:['c','选项c'],D:['d','选项d'],E:['e','选项e'],answer:['answer','答案'],explanation:['explanation','解析'],explanation_zh:['explanation_zh','中文解析'],tip:['tip','易错点'],kp:['kp','知识点'],mock:['mock']};
function csvToBank(text,base){
  const rows=parseCSV(text);if(rows.length<2)throw new Error('CSV 至少要有表头和一行题目');
  const head=rows[0].map(h=>h.trim().toLowerCase());const idx={};
  for(const k in COLS){idx[k]=head.findIndex(h=>COLS[k].includes(h))}
  ['subject','question','A','B','answer'].forEach(k=>{if(idx[k]<0)throw new Error(`CSV 缺少必需的列：${COLS[k][0]}`)});
  const subjects=((base&&base.subjects)||DEFAULT_SUBJECTS).slice();let created=0;
  const findSj=raw=>{const name=String(raw).trim();if(!name)return null;const v=name.toLowerCase();let s=subjects.find(s=>s.id===v||String(s.zh).toLowerCase()===v||String(s.en).toLowerCase()===v);if(!s){created++;s={id:'sj'+(subjects.length+1),zh:name,en:name,no:subjects.length+1};subjects.push(s)}return s.id};
  const srcIds={},sources=[],readings={},q=[];const errs=[];
  const pe=t=>t.split(/\r?\n/).map(x=>`<p>${esc(x)}</p>`).join('');
  rows.slice(1).forEach((r,i)=>{
    const g=k=>idx[k]>=0?(r[idx[k]]||'').trim():'';const line=i+2;
    const sj=findSj(g('subject'));if(!sj){errs.push(`第 ${line} 行：科目是空的`);return}
    const srcName=g('source')||'我的题库';
    if(!srcIds[srcName]){const id='u'+(sources.length+1);srcIds[srcName]=id;sources.push({id,name:srcName,short:srcName.length>16?srcName.slice(0,15)+'…':srcName,mock:/mock|模考/i.test(srcName)||g('mock')==='1'})}
    const src=srcIds[srcName];const set=g('set')||(subjects.find(s=>s.id===sj).zh);
    const rid=src+'::'+set+'::'+sj;if(!readings[rid])readings[rid]={id:rid,title:set,subject:sj,src,count:0};
    const opts=['A','B','C','D','E'].map(g).filter(x=>x!=='');
    let a=g('answer').toUpperCase();a=/^[A-E]$/.test(a)?a.charCodeAt(0)-65:(/^\d+$/.test(a)?(+a)-1:-1);
    if(a<0||a>=opts.length){errs.push(`第 ${line} 行：答案 "${g('answer')}" 不对应任何选项`);return}
    const o={id:'U'+(i+1),r:rid,sj,n:+g('no')||(readings[rid].count+1),s:pe(g('question')),o:opts,a};
    if(g('explanation'))o.e=pe(g('explanation'));if(g('explanation_zh'))o.z=g('explanation_zh');if(g('tip'))o.t=g('tip');
    const kp=g('kp').match(/^(\d+)\.(\d+)$/);if(kp)o.k=[+kp[1],+kp[2]];
    readings[rid].count++;q.push(o);
  });
  if(errs.length)throw new Error(errs.slice(0,8).join('\n')+(errs.length>8?`\n……共 ${errs.length} 处问题`:''));
  const used=new Set(q.map(x=>x.sj));const same=!created;
  return {format:'shuati-room/bank@1',subjects:subjects.filter(s=>used.has(s.id)),sources,readings:Object.values(readings),q,kp:same?((base&&base.kp)||[]):[],gl:same?((base&&base.gl)||[]):[],exam:same?(base&&base.exam):undefined,jc:{}};
}
// cards: accepts {key:{core,f|ftex,pts,trap}} (AI pipeline output) or {key:{c,f,p,t}} (site format)
function toJC(cards){
  if(!cards||typeof cards!=='object'||Array.isArray(cards))throw new Error('知识卡文件应该是 { "章节.知识点": {...} } 形式的对象');
  const out={};let bad=0;
  for(const k in cards){if(!/^\d+\.\d+$/.test(k)){bad++;continue}const c=cards[k]||{};
    const o={c:c.c||c.core||'',f:c.ftex||c.f||[],p:c.p||c.pts||[],t:c.t||c.trap||[]};
    if(c.s)o.s=c.s;else if(Array.isArray(c.srcs))o.s=c.srcs.map(x=>[String(x.src||''),[].concat(x.pg||[]).join(', ')]);else if(c.src)o.s=[[String(c.src),String(c.pg||'')]];if(c.b||c.bu)o.b=1;
    if(!o.c&&!o.p.length){bad++;continue}out[k]=o}
  if(!Object.keys(out).length)throw new Error('没有找到有效的知识卡（键要是 "12.3" 这样的格式）');
  return {jc:out,bad};
}
function download(name,obj){const b=new Blob([typeof obj==='string'?obj:JSON.stringify(obj)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsText(f)})}
async function saveBank(b){await IDB.set('bank',b);location.hash='import';location.reload()}
function currentBank(){return S.raw}

function vImport(){
  const b=S.raw;const nq=b.q.length,nc=Object.keys(b.jc||{}).length,nk=(b.kp||[]).reduce((a,m)=>a+m.g.length,0);
  return `<div><div class="eyebrow">导入</div><h1>用你<em>自己的</em>题库和讲义</h1>
  <p class="sub">所有数据只存在这台电脑的浏览器里，不会上传到任何地方。换电脑时用下面的"导出"带走。格式说明见项目里的 docs/FORMAT.md。</p></div>
  ${S.sample?`<div class="panel" style="border-color:var(--accent)"><b>现在显示的是示例题库</b><p class="sub" style="margin:6px 0 0">20 道原创演示题，用来看看功能。导入你自己的题库后会替换掉它。</p></div>`:''}
  <div class="panel"><div class="sec-h"><h2>当前题库</h2><span class="eyebrow">${esc(b.title||'')}</span></div>
    <p class="sub" style="margin:0">${nq.toLocaleString()} 题 · ${S.meta.readings.length} 个章节 · 知识点 ${nk} 个 · 知识卡 ${nc} 张 · 来源：${SRCS.map(s=>esc(s.name)).join('、')}</p></div>
  <div class="panel"><div class="sec-h"><h2>1 · 导入题目</h2></div>
    <p class="sub">CSV：一行一题，必需列 subject (科目，任意名字), question, A, B, answer；可选 source, set, no, C, D, explanation, explanation_zh, tip, kp。JSON：完整题库文件 (bank.json)。</p>
    <div class="row" style="gap:8px;flex-wrap:wrap"><label class="btn pri">选择 CSV 或 JSON<input type="file" id="impQ" accept=".csv,.json,text/csv,application/json" hidden></label>
    <label class="row" style="gap:6px"><input type="checkbox" id="impAppend" ${S.sample?'':'checked'}> 追加到当前题库（不勾就替换）</label>
    <button class="btn sm ghost" id="tplCsv">下载 CSV 模板</button></div></div>
  <div class="panel"><div class="sec-h"><h2>2 · 导入知识卡</h2></div>
    <p class="sub">用 prompts/ 里的提示词让你自己的 AI 读讲义生成 cards.json，再导入这里。同一个知识点会被新卡覆盖。</p>
    <label class="btn pri">选择 cards.json<input type="file" id="impC" accept=".json,application/json" hidden></label></div>
  <div class="panel"><div class="sec-h"><h2>3 · 知识点目录（可选）</h2></div>
    <p class="sub">示例自带 CFA 一级的目录。别的考试用 prompts/00 让 AI 从考纲或讲义目录生成 taxonomy.json，再导入这里。</p>
    <label class="btn">选择 taxonomy.json<input type="file" id="impT" accept=".json,application/json" hidden></label></div>
  <div class="panel"><div class="sec-h"><h2>备份与迁移</h2></div>
    <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn" id="expB">导出题库</button><button class="btn" id="expP">导出学习记录</button>
    <label class="btn">恢复学习记录<input type="file" id="impP" accept=".json,application/json" hidden></label>
    <button class="btn ghost" id="rstB">清除题库，回到示例</button></div>
    <p class="sub" style="margin:8px 0 0">学习记录 = 做题进度、错题本、笔记、知识卡修改、考试日期。</p></div>
  <p class="sub" id="impMsg" style="white-space:pre-wrap"></p>`;
}
bind.import=function(){
  const msg=t=>{$('#impMsg').textContent=t};
  const fail=e=>{msg('导入失败：\n'+(e&&e.message||e))};
  $('#impQ').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{
    const txt=await readFile(f);const isCsv=/\.csv$/i.test(f.name)||!/^\s*[\{\[]/.test(txt);
    let nb=isCsv?csvToBank(txt,S.raw):normalizeBank(JSON.parse(txt));
    const sameDomain=nb.subjects.every(x=>S.raw.subjects.some(y=>y.id===x.id));
    if(!isCsv&&sameDomain){if(!nb.kp.length)nb.kp=S.raw.kp;if(!nb.gl.length)nb.gl=S.raw.gl;if(!nb.exam)nb.exam=S.raw.exam}
    if($('#impAppend').checked&&!S.sample){const cur=JSON.parse(JSON.stringify(S.raw));const tag='i'+Date.now().toString(36)+'_';
      nb.q.forEach(q=>{q.id=tag+q.id;q.r=tag+q.r});nb.readings.forEach(r=>{r.id=tag+r.id});
      nb.sources.forEach(s=>{const ex=cur.sources.find(x=>x.name===s.name);const nid=ex?ex.id:tag+s.id;nb.readings.forEach(r=>{if(r.src===s.id)r.src=nid});if(!ex)cur.sources.push(Object.assign({},s,{id:nid}))});
      nb.subjects.forEach(x=>{if(!cur.subjects.some(y=>y.id===x.id))cur.subjects.push(x)});cur.q=cur.q.concat(nb.q);cur.readings=cur.readings.concat(nb.readings);Object.assign(cur.jc,nb.jc||{});nb=cur}
    else if(isCsv){nb.jc=S.sample?{}:S.raw.jc}
    nb=normalizeBank(nb);if(S.sample&&!isCsv&&!Object.keys(nb.jc).length)nb.jc={};
    msg(`读到 ${nb.q.length} 题，正在保存…`);await saveBank(nb)}catch(err){fail(err)}};
  $('#impC').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const {jc,bad}=toJC(JSON.parse(await readFile(f)));const nb=JSON.parse(JSON.stringify(S.raw));nb.jc=Object.assign(nb.jc||{},jc);
    const miss=Object.keys(jc).filter(k=>{const [m,t]=k.split('.').map(Number);return !(nb.kp[m]&&nb.kp[m].g[t])}).length;
    msg(`导入 ${Object.keys(jc).length} 张知识卡${bad?`，跳过 ${bad} 条格式不对的`:''}${miss?`；其中 ${miss} 张在知识点目录里找不到对应位置，不会显示`:''}`);await saveBank(nb)}catch(err){fail(err)}};
  $('#impT').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const kp=JSON.parse(await readFile(f));
    if(!Array.isArray(kp)||!kp.every(m=>m&&m.t&&Array.isArray(m.g)))throw new Error('taxonomy 应该是数组，每项有 t (章节名) 和 g (知识点列表)');
    const nb=JSON.parse(JSON.stringify(S.raw));nb.kp=kp;await saveBank(nb)}catch(err){fail(err)}};
  $('#tplCsv').onclick=()=>{const b=new Blob(['﻿subject,source,set,no,question,A,B,C,answer,explanation,explanation_zh,tip,kp\nquant,我的题库,Rates and Returns,1,"A deposit pays 12% compounded monthly. Its EAR is closest to:",12.00%,12.68%,12.36%,B,"EAR = 1.01^12 - 1 = 12.68%","按月复利换算 EAR","12.36% 是按季度复利",85.5\n'],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='questions_template.csv';a.click()};
  $('#expB').onclick=()=>download('bank.json',S.raw);
  $('#expP').onclick=()=>download('shuati-progress-'+today()+'.json',{v:1,ls:localStorage.getItem(LS),saved:localStorage.getItem(RK)});
  $('#impP').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await readFile(f));if(!d||!d.ls)throw new Error('不是本站导出的学习记录');
    localStorage.setItem(LS,d.ls);if(d.saved)localStorage.setItem(RK,d.saved);location.reload()}catch(err){fail(err)}};
  $('#rstB').onclick=async()=>{if(!confirmBox('清除导入的题库，回到示例题库？学习记录不会删除。'))return;await IDB.del('bank');location.reload()};
};
// inline two-step confirm (no browser dialogs): first click arms, second click within 4s confirms
function confirmBox(text){const now=Date.now();if(confirmBox._t&&now-confirmBox._t<4000&&confirmBox._x===text){confirmBox._t=0;return true}confirmBox._t=now;confirmBox._x=text;toast(text+' 再点一次确认');return false}
